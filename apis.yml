aid: vetic
name: Vetic
description: 'Vetic is a pet healthcare company in India operating a chain of full-service
  veterinary clinics and hospitals across 11 cities, paired with a consumer mobile
  app. Founded by Gaurav Ajmera (ex-COO OYO), Vetic offers in-clinic vet consultations,
  vaccinations, in-house diagnostics (blood work, X-ray, imaging, endoscopy), surgery,
  physiotherapy, 24/7 emergency and intensive care, grooming, an in-house pharmacy,
  pet supplies, pet insurance, video vet consultations, digital medical records, and
  2-hour pet food delivery. It is a consumer (B2C) business with no public developer
  API surface at this time; this profile captures its public web and app footprint.'
